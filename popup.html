<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TabHarbor</title><link rel="stylesheet" href="popup.css"></head><body><header><small>YOUR BROWSER, ORGANIZED</small><h1>TabHarbor</h1></header><main><p id="status" role="status">Loading tabs…</p><button id="group">Group current window by domain</button><button id="dedupe">Preview duplicate tabs</button><div id="duplicates"></div><label for="name">Workspace name</label><input id="name" maxlength="60" placeholder="Research session"><button id="save">Save current workspace</button><h2>Saved workspaces</h2><div id="spaces"></div><h2>Focus timer</h2><label for="minutes">Minutes</label><input type="number" id="minutes" min="1" max="180" value="25"><button id="focus">Start focus timer</button><button id="cancel">Cancel timer</button><p id="timer"></p><p class="note">Saved URLs stay on this device. No telemetry or external requests. Chrome internal pages are excluded.</p></main><script type="module" src="popup.js"></script></body></html>
